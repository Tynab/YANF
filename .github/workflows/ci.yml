name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build, test and pack
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      # The .NET 10 SDK builds every target framework (net481, net8.0-windows, net10.0-windows) and its runtime runs the
      # net10.0-windows tests. It needs MSBuild 18.0 (Visual Studio 2026) or later for net10.0: 17.14 builds only with
      # warning NETSDK1233. windows-latest has Visual Studio 2026, which setup-msbuild picks
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Visual Studio MSBuild, not dotnet build: core MSBuild cannot embed the bitmap entries of the .resx files for net481.
      # Builds all target frameworks: the library (net481, net8.0-windows, net10.0-windows), the sample and the tests
      # (net481, net10.0-windows)
      - name: Build
        id: build
        run: msbuild YANF.sln -restore -m -nologo -v:minimal -p:Configuration=Release

      # The tests create windows, so they need the interactive desktop of the hosted runner. One step per target
      # framework, so that a failure names its framework and the second run still happens after the first one failed
      - name: Test (net481)
        run: dotnet test tests/YANF.Tests/YANF.Tests.csproj --configuration Release --framework net481 --no-build --logger "trx;LogFileName=YANF.Tests.net481.trx" --results-directory TestResults --blame

      - name: Test (net10.0-windows)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test tests/YANF.Tests/YANF.Tests.csproj --configuration Release --framework net10.0-windows --no-build --logger "trx;LogFileName=YANF.Tests.net10.0-windows.trx" --results-directory TestResults --blame

      # Package validation (EnablePackageValidation, baseline 1.0.1) runs as part of Pack
      - name: Pack
        run: msbuild YANF/YANF.csproj -t:Pack -nologo -v:minimal -p:Configuration=Release -p:NoBuild=true "-p:PackageOutputPath=${{ github.workspace }}\artifacts"

      - name: Check package contents
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $packages = @(Get-ChildItem artifacts -Filter *.nupkg)
          $symbols = @(Get-ChildItem artifacts -Filter *.snupkg)
          if ($packages.Count -ne 1) { throw "Expected exactly one .nupkg in artifacts, found $($packages.Count)" }
          if ($symbols.Count -ne 1) { throw "Expected exactly one .snupkg in artifacts, found $($symbols.Count)" }
          $package = $packages[0]
          $zip = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
          try {
            $entries = @($zip.Entries | ForEach-Object { $_.FullName })
            $nuspecEntry = @($zip.Entries | Where-Object { $_.FullName -match '^[^/]+\.nuspec$' })[0]
            $nuspec = $null
            if ($nuspecEntry) {
              $reader = New-Object System.IO.StreamReader($nuspecEntry.Open())
              try { $nuspec = [xml]$reader.ReadToEnd() } finally { $reader.Dispose() }
            }
          } finally { $zip.Dispose() }
          Write-Host "$($package.Name):"
          $entries | ForEach-Object { Write-Host "  $_" }
          $problems = @()
          # One YANF.dll per target framework, in NuGet's folder names (net8.0-windows is packed as net8.0-windows7.0)
          $expectedLibs = @('lib/net481/YANF.dll', 'lib/net8.0-windows7.0/YANF.dll', 'lib/net10.0-windows7.0/YANF.dll')
          foreach ($lib in $expectedLibs) {
            if ($entries -notcontains $lib) { $problems += "$lib is missing" }
          }
          foreach ($entry in $entries) {
            if ($entry -match '^lib/[^/]+/YANF\.dll$' -and $expectedLibs -notcontains $entry) { $problems += "unexpected target framework: $entry" }
          }
          foreach ($entry in $entries) {
            if ($entry -match '(^|/)nuget\.config$') { $problems += "forbidden file: $entry" }
            elseif ($entry -match '\.exe$') { $problems += "forbidden executable: $entry" }
            elseif ($entry -match '\.cs$') { $problems += "forbidden source file: $entry" }
            elseif ($entry -match '(^|/)(obj|bin)/') { $problems += "forbidden build output: $entry" }
            elseif ($entry -match '^content(Files)?/') { $problems += "forbidden content: $entry" }
          }
          # Like 1.0.1, no package dependencies and no .NET Framework assembly references, which NuGet would add to every
          # consumer project (a <Reference> without Pack="false" is packed as a frameworkAssembly)
          if ($null -eq $nuspec) { $problems += "no .nuspec in the package" }
          else {
            foreach ($tag in 'dependency', 'frameworkAssembly') {
              foreach ($node in $nuspec.GetElementsByTagName($tag)) { $problems += "unexpected $($tag) in the nuspec: $($node.OuterXml)" }
            }
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $expected = "Tynab.YANF.$($env:GITHUB_REF_NAME.TrimStart('v')).nupkg"
            if ($package.Name -ne $expected) { $problems += "tag $($env:GITHUB_REF_NAME) needs $expected, the project built $($package.Name)" }
          }
          if ($problems.Count -gt 0) {
            $problems | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  publish:
    name: Publish to nuget.org
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Push
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols
          dotnet nuget push "artifacts/*.snupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
